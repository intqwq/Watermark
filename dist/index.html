<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="为图片添加精致的文字水印，自选四角位置，实时预览并原尺寸下载。图片仅在你的浏览器中处理。">
  <meta name="theme-color" content="#f5f6f8"><title>印记 · 电子水印器</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="./" aria-label="印记首页"><span class="brand-mark">印</span><strong>印记<span>WATERMARK STUDIO</span></strong></a><span class="private"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8 12 3 3 5-6"/></svg>本地处理，图片不上传</span></header>
  <main>
    <div class="page-title"><div><p class="eyebrow">MAKE IT YOURS</p><h1>让每张图片，拥有你的印记<span>。</span></h1><p class="intro">一枚恰到好处的水印，留住你的表达。</p></div><span class="step-label">上传图片 <i>／</i> 定制水印 <i>／</i> 保存作品</span></div>
    <div class="workspace">
      <section class="preview-panel" aria-label="图片预览">
        <div class="panel-bar"><h2>画布预览</h2><span id="image-info">等待添加图片</span><button id="replace" class="text-button" hidden>更换图片</button></div>
        <div class="stage" id="drop-zone">
          <div id="empty-state" class="empty-state"><div class="upload-art"><svg viewBox="0 0 64 64"><rect x="11" y="10" width="42" height="44" rx="7"/><circle cx="24" cy="24" r="4"/><path d="m13 44 12-12 9 8 8-9 10 12"/></svg><span>+</span></div><h2>从一张图片开始</h2><p>将图片拖到这里，或从设备中选择</p><button class="upload-button" id="upload">选择图片 <span>↗</span></button><small>支持 JPG、PNG、WebP · 最大 30 MB</small></div>
          <canvas id="preview" aria-label="添加水印后的图片预览" hidden></canvas>
          <div class="drag-overlay" aria-hidden="true">松开鼠标，添加图片</div>
        </div>
        <div class="preview-footer"><span><span class="tiny-square"></span><span id="preview-note">上传后即时预览水印效果</span></span><span>原尺寸导出 <span class="small-arrow">↗</span></span></div>
      </section>
      <aside class="settings" aria-label="水印设置">
        <div class="settings-heading"><h2>定制水印</h2><button class="text-button" id="reset">重置</button></div>
        <div class="field"><label for="watermark">水印内容</label><input id="watermark" type="text" value="inline_int@X" maxlength="100" autocomplete="off" spellcheck="false"><div class="input-meta"><span>你的名字、账号，或一句话</span><span id="char-count">12 / 100</span></div></div>
        <fieldset class="field"><legend>水印位置</legend><div class="positions"><button data-position="tl" aria-pressed="false"><span class="corner tl"></span>左上</button><button data-position="tr" aria-pressed="false"><span class="corner tr"></span>右上</button><button data-position="bl" aria-pressed="false"><span class="corner bl"></span>左下</button><button data-position="br" aria-pressed="true"><span class="corner br"></span>右下</button></div></fieldset>
        <fieldset class="field"><legend>水印风格</legend><div class="styles"><button data-style="capsule" aria-pressed="true"><span class="style-sample capsule">Aa</span><span>质感胶囊</span></button><button data-style="simple" aria-pressed="false"><span class="style-sample simple">Aa</span><span>简约文字</span></button><button data-style="serif" aria-pressed="false"><span class="style-sample serif">Aa</span><span>优雅衬线</span></button></div></fieldset>
        <div class="field range-field"><label for="size">水印大小 <output id="size-value">4%</output></label><input id="size" type="range" min="2" max="10" step="0.5" value="4"></div>
        <div class="field range-field"><label for="opacity">不透明度 <output id="opacity-value">90%</output></label><input id="opacity" type="range" min="10" max="100" step="5" value="90"></div>
        <fieldset class="color-field"><legend>文字颜色</legend><div><button data-color="light" aria-label="白色文字" aria-pressed="true"><span class="swatch light"></span>白色</button><button data-color="dark" aria-label="深色文字" aria-pressed="false"><span class="swatch dark"></span>深色</button></div></fieldset>
        <div class="export-area"><button id="download" disabled><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>下载水印图片</button><p>PNG 格式 · 保留原图尺寸</p></div>
      </aside>
    </div>
    <div class="bottom-note"><span>轻一点的修饰，刚刚好的存在。</span><span>你的图片，始终只属于你。</span></div>
    <div id="status" role="status" aria-live="polite"></div>
    <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" hidden>
  </main>
  <script type="module" src="./app.js"></script>
</body></html>
